name: ci

on:
  # Every push, not just main: a branch often sits pushed for a while before
  # it has a pull request, and until then nothing else would check it. The
  # cost is that a branch with an open pull request is built twice, once per
  # event; the concurrency group below cancels superseded runs so only the
  # newest push of each ref survives.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_ERL_OPTIONS: "+fnu"

jobs:
  # What a contributor runs locally: format, compile clean, test. Versions
  # follow .claude/hooks/session-start.sh (Erlang 28, Elixir 1.20).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The seed_* tools against the real open-seed engine: build the engine
  # from source, instantiate the template on its local SQLite backend with
  # test/support/seed_fixture.sh, and drive `seed mcp serve` from the tests
  # tagged :integration. Both repos are public.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating: a push to either repo's default branch would
      # otherwise change what an unchanged tiller commit is tested against,
      # and the two could drift apart mid-release. Verified together, both
      # ways round, before pinning. Bump deliberately.
      - uses: actions/checkout@v4
        with:
          repository: shaunlmason/open-seed
          ref: v0.1.0
          path: .ci/open-seed

      - uses: actions/checkout@v4
        with:
          repository: shaunlmason/open-seed-engine
          ref: v0.16.0
          path: .ci/open-seed-engine

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: build the engine
        run: cd .ci/open-seed-engine && go build -o "$GITHUB_WORKSPACE/.ci/seed" ./cmd/seed

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      - name: instantiate a seed repo on fastcards
        run: test/support/seed_fixture.sh .ci/open-seed .ci/seed .ci/fixture

      - name: integration tests
        env:
          TILLER_SEED_CMD: ${{ github.workspace }}/.ci/seed mcp serve
          TILLER_SEED_DIR: ${{ github.workspace }}/.ci/fixture
        run: mix test --include integration test/seed_integration_test.exs
